name: Build Windows

# Собирает Windows .exe (установщик + portable) и публикует в Releases.
on:
  push:
    branches:
      - claude/wizardly-franklin-oa8wcd
  workflow_dispatch:

permissions:
  contents: write

# Новый запуск отменяет предыдущий незавершённый — без гонки за один Release.
concurrency:
  group: build-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # electron-builder иногда не докачивает бинарник Electron (EOF).
      # Повторяем до 3 раз, чтобы пережить временные сетевые сбои.
      - name: Build renderer + package Windows app
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $max = 3
          for ($i = 1; $i -le $max; $i++) {
            Write-Host "=== Попытка сборки $i из $max ==="
            npm run dist
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Сборка упала (код $LASTEXITCODE). Повтор через 15с..."
            Start-Sleep -Seconds 15
          }
          Write-Error "Сборка не удалась после $max попыток"
          exit 1

      # Артефакты сборки доступны во вкладке Actions (запасной способ скачать).
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ymdesk-windows
          path: |
            release/*.exe

      # Публикуем .exe в Release — это и есть прямая ссылка для скачивания.
      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: win-latest
          name: Hailu (Windows)
          prerelease: true
          body: |
            Сборка Hailu для Windows.

            - `Hailu Setup *.exe` — установщик (рекомендуется)
            - `Hailu *.exe` (portable) — запуск без установки
          files: |
            release/*.exe
