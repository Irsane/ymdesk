name: Build Windows

# Собирает Windows .exe (установщик + portable) и публикует в Releases.
on:
  push:
    branches:
      - claude/wizardly-franklin-oa8wcd
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + package Windows app
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Артефакты сборки доступны во вкладке Actions (запасной способ скачать).
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ymdesk-windows
          path: |
            release/*.exe

      # Публикуем .exe в Release — это и есть прямая ссылка для скачивания.
      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: win-latest
          name: YM Desk (Windows)
          prerelease: true
          body: |
            Сборка YM Desk для Windows.

            - `YM Desk Setup *.exe` — установщик (рекомендуется)
            - `YM Desk *.exe` (portable) — запуск без установки
          files: |
            release/*.exe
