name: Build Windows

# Собирает Windows .exe (установщик + portable) и публикует в Releases
# под версией из package.json. Старые релизы и теги удаляются — остаётся
# только последняя версия.
on:
  push:
    branches:
      - claude/wizardly-franklin-oa8wcd
  workflow_dispatch:

permissions:
  contents: write

# Новый запуск отменяет предыдущий незавершённый — без гонки за релиз.
concurrency:
  group: build-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT
          Write-Host "Версия: $v"

      - name: Install dependencies
        run: npm ci

      # electron-builder иногда не докачивает бинарник Electron (EOF).
      # Повторяем до 3 раз, чтобы пережить временные сетевые сбои.
      - name: Build renderer + package Windows app
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Подпись самоподписанным сертификатом (снимает SmartScreen после импорта cert).
          CSC_LINK: build/cert/hailu.pfx
          CSC_KEY_PASSWORD: hailu
        run: |
          $max = 3
          for ($i = 1; $i -le $max; $i++) {
            Write-Host "=== Попытка сборки $i из $max ==="
            npm run dist
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Сборка упала (код $LASTEXITCODE). Повтор через 15с..."
            Start-Sleep -Seconds 15
          }
          Write-Error "Сборка не удалась после $max попыток"
          exit 1

      # Удаляем ВСЕ прошлые релизы и их теги — оставляем только текущую версию.
      - name: Remove old releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $keep = "${{ steps.ver.outputs.tag }}"
          $tags = gh release list --limit 100 --json tagName --jq '.[].tagName'
          foreach ($t in $tags) {
            if ($t -and $t -ne $keep) {
              Write-Host "Удаляю старый релиз $t"
              gh release delete $t --yes --cleanup-tag
            }
          }

      # Публикуем новую версию как отдельный релиз (только свежие файлы).
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Hailu ${{ steps.ver.outputs.version }}
          prerelease: false
          body: |
            **Hailu ${{ steps.ver.outputs.version }}** — десктоп-клиент для Windows.

            - `Hailu Setup ${{ steps.ver.outputs.version }}.exe` — установщик (подписан)

            ### Чтобы не появлялось предупреждение SmartScreen
            1. Скачайте `hailu.cer` и `Доверять-Hailu.bat` (ниже).
            2. Запустите `Доверять-Hailu.bat` от имени администратора (один раз).
            3. Устанавливайте `Hailu Setup` — предупреждения больше не будет.

            Либо просто нажмите в окне SmartScreen «Подробнее» → «Выполнить в любом случае».
          files: |
            release/*Setup*.exe
            build/cert/hailu.cer
            build/cert/Доверять-Hailu.bat
